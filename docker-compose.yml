# Airflow 3 (standalone) + Postgres. Subir: docker compose up -d · Parar: docker compose stop
# O Postgres não tem senha porque a porta não é exposta fora do Docker; tokens ficam em Airflow Variables.
services:
  postgres:
    image: postgres:16-alpine
    container_name: akona-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_DB: airflow
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - akona-banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 20

  airflow:
    image: apache/airflow:3.3.2
    container_name: akona-airflow
    command: standalone
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Sao_Paulo
      # Docker no Windows importa o Airflow devagar
      AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: "180"
      AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: "120"
      AIRFLOW__DAG_PROCESSOR__DAG_FILE_PROCESSOR_TIMEOUT: "240"
      PYTHONPATH: /opt/airflow/include
      AKONA_CONFIG: /opt/akona/config
      AKONA_NOTEBOOKS: /opt/akona/databricks
      AKONA_CHEGADA: /opt/airflow/chegada
      # opcional: antivírus que intercepta HTTPS (ver README)
      REQUESTS_CA_BUNDLE: ${AKONA_CA_BUNDLE:-}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./include:/opt/airflow/include:ro
      - ./config:/opt/akona/config:ro
      - ./databricks:/opt/akona/databricks:ro
      - ./chegada:/opt/airflow/chegada
      - ./certs:/opt/airflow/certs:ro

volumes:
  akona-banco:
