# Fonte: município e Censo 2022 de Osasco (API pública do IBGE, sem chave)
# Gera a DAG akona_ibge: API -> chegada/ibge/ibge_AAAA-MM-DD.json -> Volume -> bronze_ibge -> prata_ibge_indicadores
#
# Várias requisições = o arquivo do dia é um "envelope" com a resposta bruta de cada uma, no campo de mesmo nome.
# Para trazer outro dado do IBGE, copie este arquivo com outro nome (ex.: ibge_pib.yaml) e troque as requisições.

nome: ibge
descricao: IBGE - API de localidades e de agregados (Censo 2022)
extrator: http
depende_de: []
envelope: true

requisicoes:
  - nome: municipio
    url: https://servicodados.ibge.gov.br/api/v1/localidades/municipios/{cod_ibge}

  - nome: censo_populacao          # tabela 4714: população (93), área (6318) e densidade (614)
    url: https://servicodados.ibge.gov.br/api/v3/agregados/4714/periodos/2022/variaveis/93|6318|614
    parametros:
      localidades: "N6[{cod_ibge}]"

  - nome: censo_domicilios         # tabela 4712: domicílios (381), moradores (382) e média de moradores (5930)
    url: https://servicodados.ibge.gov.br/api/v3/agregados/4712/periodos/2022/variaveis/381|382|5930
    parametros:
      localidades: "N6[{cod_ibge}]"

bronze:
  formato: json

prata:
  notebook: prata/prata_ibge
  tabela: prata_ibge_indicadores
