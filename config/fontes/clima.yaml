nome: clima
descricao: Clima horário de Osasco (Open-Meteo)
extrator: http
depende_de: []

requisicoes:
  - nome: clima
    url: https://api.open-meteo.com/v1/forecast
    parametros:
      latitude: "{latitude}"
      longitude: "{longitude}"
      start_date: "{dia}"
      end_date: "{dia}"
      timezone: "{timezone}"
      hourly: precipitation,wind_speed_10m,wind_gusts_10m,temperature_2m,weather_code

bronze:
  formato: json

prata:
  notebook: prata/prata_clima
  tabela: prata_clima_horario
