<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="515" viewBox="0 0 1200 515" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <title>Akona Energy · fluxo de dados da fonte ao MVP</title>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4a6b"/>
    </marker>
  </defs>
  <rect width="1200" height="515" fill="#ffffff"/>

  <!-- Faixa 1: coleta -->
  <text x="30" y="28" font-size="13" font-weight="700" fill="#6b7280" letter-spacing="1.5">ETAPAS 1 E 2 · COLETA NO AIRFLOW (DOCKER, NO PC DA EQUIPE)</text>

  <g font-size="15" fill="#1f2937">
    <rect x="30" y="42" width="250" height="44" rx="8" fill="#eef2ff" stroke="#3b4a6b"/>
    <text x="45" y="60" font-weight="700" font-size="14">Open-Meteo (API pública)</text>
    <text x="45" y="78" font-size="12" fill="#4b5563">clima horário de Osasco</text>

    <rect x="30" y="92" width="250" height="44" rx="8" fill="#eef2ff" stroke="#3b4a6b"/>
    <text x="45" y="110" font-weight="700" font-size="14">IBGE (API pública)</text>
    <text x="45" y="128" font-size="12" fill="#4b5563">município + Censo 2022</text>

    <rect x="30" y="142" width="250" height="44" rx="8" fill="#eef2ff" stroke="#3b4a6b"/>
    <text x="45" y="160" font-weight="700" font-size="14">API Akona (simulada)</text>
    <text x="45" y="178" font-size="12" fill="#4b5563">chamados dos moradores</text>

    <rect x="30" y="192" width="250" height="44" rx="8" fill="#eef2ff" stroke="#3b4a6b"/>
    <text x="45" y="210" font-weight="700" font-size="14">API da manutenção (simulada)</text>
    <text x="45" y="228" font-size="12" fill="#4b5563">ordens de serviço por poste</text>

    <rect x="360" y="45" width="350" height="190" rx="8" fill="#f4f6fb" stroke="#3b4a6b" stroke-width="1.5"/>
    <text x="378" y="72" font-weight="700" font-size="16">Airflow 3 · trigger-master (06:00)</text>
    <text x="378" y="100" font-size="13.5">• clima ∥ ibge → chamados → manutencao</text>
    <text x="378" y="125" font-size="13.5">• cada fonte: API → chegada → Volume</text>
    <text x="378" y="150" font-size="13.5">   → Bronze → Prata (1 DAG por processo)</text>
    <text x="378" y="175" font-size="13.5">• depois: akona_ouro → akona_consultas</text>
    <text x="378" y="200" font-size="13.5">• cadastros em config/, tokens em Variables</text>
    <text x="378" y="222" font-size="12" fill="#6b7280">modos: incremental · data_especifica · full</text>

    <rect x="790" y="75" width="380" height="130" rx="8" fill="#f4f6fb" stroke="#3b4a6b" stroke-width="1.5"/>
    <text x="808" y="102" font-weight="700" font-size="16">chegada/ (pasta local)</text>
    <text x="808" y="126" font-size="13">clima/clima_AAAA-MM-DD.json</text>
    <text x="808" y="146" font-size="13">ibge/ibge_AAAA-MM-DD.json</text>
    <text x="808" y="166" font-size="13">chamados/chamados_AAAA-MM-DD.json</text>
    <text x="808" y="186" font-size="13">manutencao/manutencao_AAAA-MM-DD.json</text>
  </g>

  <g stroke="#3b4a6b" stroke-width="1.8" fill="none" marker-end="url(#seta)">
    <line x1="280" y1="64" x2="356" y2="64"/>
    <line x1="280" y1="114" x2="356" y2="114"/>
    <line x1="280" y1="164" x2="356" y2="164"/>
    <line x1="280" y1="214" x2="356" y2="214"/>
    <line x1="710" y1="140" x2="786" y2="140"/>
    <polyline points="980,205 980,262 135,262 135,322"/>
  </g>
  <rect x="250" y="250" width="700" height="24" fill="#ffffff"/>
  <text x="600" y="267" font-size="13" fill="#374151" text-anchor="middle">as DAGs enviam os lotes ao Volume (Files API) e executam cada notebook no Databricks (Jobs API)</text>

  <!-- Faixa 2: lakehouse -->
  <text x="160" y="305" font-size="13" font-weight="700" fill="#6b7280" letter-spacing="1.5">ETAPAS 3 A 6 · LAKEHOUSE NO DATABRICKS FREE (SERVERLESS), ORQUESTRADO PELO AIRFLOW</text>

  <g font-size="15" fill="#1f2937">
    <rect x="30" y="325" width="206" height="120" rx="8" fill="#f4f6fb" stroke="#3b4a6b" stroke-width="1.5"/>
    <text x="45" y="352" font-weight="700">Volume (UC)</text>
    <text x="45" y="377" font-size="13">workspace.akona.chegada</text>
    <text x="45" y="398" font-size="13">lote 1, lote 2 e</text>
    <text x="45" y="417" font-size="13">carga diária automática</text>

    <rect x="264" y="325" width="206" height="120" rx="8" fill="#f6e7d8" stroke="#8a5a2b" stroke-width="1.5"/>
    <text x="279" y="352" font-weight="700">Bronze</text>
    <text x="279" y="377" font-size="13">Auto Loader</text>
    <text x="279" y="398" font-size="13">lê só arquivos novos</text>
    <text x="279" y="417" font-size="13">e não duplica</text>

    <rect x="498" y="325" width="206" height="120" rx="8" fill="#eceff1" stroke="#607d8b" stroke-width="1.5"/>
    <text x="513" y="352" font-weight="700">Prata</text>
    <text x="513" y="377" font-size="13">tipos, nulos, inválidos</text>
    <text x="513" y="398" font-size="13">regras de qualidade</text>
    <text x="513" y="417" font-size="13">MERGE pela chave</text>

    <rect x="732" y="325" width="206" height="120" rx="8" fill="#fff4cc" stroke="#b08900" stroke-width="1.5"/>
    <text x="747" y="352" font-weight="700">Ouro</text>
    <text x="747" y="377" font-size="13">2 fatos + 6 dimensões</text>
    <text x="747" y="398" font-size="13">5 consultas + views da tela</text>
    <text x="747" y="417" font-size="13">LGPD: hash e máscara</text>

    <rect x="966" y="325" width="206" height="120" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="981" y="352" font-weight="700">MVP · tela /gestao</text>
    <text x="981" y="377" font-size="13">lê só as views</text>
    <text x="981" y="398" font-size="13">ouro_gestao_* (mesmo</text>
    <text x="981" y="417" font-size="13">JSON do /api/indicadores)</text>
  </g>

  <g stroke="#3b4a6b" stroke-width="1.8" fill="none" marker-end="url(#seta)">
    <line x1="236" y1="385" x2="260" y2="385"/>
    <line x1="470" y1="385" x2="494" y2="385"/>
    <line x1="704" y1="385" x2="728" y2="385"/>
    <line x1="938" y1="385" x2="962" y2="385"/>
  </g>

  <text x="30" y="478" font-size="12.5" fill="#4b5563">Tabelas: bronze_{chamados, clima, ibge, manutencao} → prata_chamados, prata_clima_horario, prata_ibge_indicadores, prata_manutencao →</text>
  <text x="30" y="498" font-size="12.5" fill="#4b5563">ouro_fato_chamados, ouro_fato_manutencao + dim_tempo, dim_clima, dim_bairro, dim_tipo_problema, dim_cidadao, dim_ponto → ouro_mvp_painel_chamados, ouro_gestao_*</text>
</svg>
